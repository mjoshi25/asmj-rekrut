<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Manage public pages | ASMJ Recruitment</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="page"><div class="page-heading"><div><span class="eyebrow">ADMINISTRATION</span><h1>Founder & compliance content</h1><p class="muted">Update the public Founder and Compliance pages.</p></div></div><div th:replace="~{fragments :: flash}"></div><form class="panel form-grid" method="post" action="/admin/site-content"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><h2>Founder page</h2><label>Headline<input name="founderHeadline" required maxlength="220" th:value="${content.founderHeadline}"/></label><label>Introduction<textarea name="founderIntro" rows="3" required th:text="${content.founderIntro}"></textarea></label><label>Founder name<input name="founderName" maxlength="160" th:value="${content.founderName}" placeholder="Leave blank until confirmed"/></label><label>Founder story / message<textarea name="founderStory" rows="5" required th:text="${content.founderStory}"></textarea></label><h2>Compliance page</h2><label>Privacy policy summary<textarea name="privacyPolicy" rows="6" required th:text="${content.privacyPolicy}"></textarea></label><label>Terms of use summary<textarea name="termsPolicy" rows="6" required th:text="${content.termsPolicy}"></textarea></label><label>Compliance contact / reporting instructions<textarea name="complianceContact" rows="3" required th:text="${content.complianceContact}"></textarea></label><div class="form-actions"><button class="button" type="submit">Save public pages</button><a class="button secondary" href="/founder">View Founder</a><a class="button secondary" href="/compliance">View Compliance</a></div><p class="muted">Policy content is a draft and should be reviewed for applicable law before publication.</p></form></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
