<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Candidate search | ASMJ Recruitment</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="page"><div class="page-heading"><div><span class="eyebrow">TALENT DISCOVERY</span><h1>Search candidates</h1><p class="muted">Filter profiles using structured details imported or maintained by candidates.</p></div></div><form class="form-card compact-form" method="get" th:action="@{/candidate-search}"><div class="form-grid"><label>Name, role or email<input name="q" th:value="${q}" placeholder="e.g. Java developer"></label><label>Skills<input name="skills" th:value="${skills}" placeholder="e.g. Java"></label><label>Qualification<input name="qualification" th:value="${qualification}" placeholder="e.g. Graduate"></label><label>Experience range<input name="experience" th:value="${experience}" placeholder="e.g. 3, 3-5 or 5+"><span class="hint">Use 3 for 3–under 4 years, 3-5 for an inclusive range, or 5+ for at least 5 years.</span></label><label>Location<input name="location" th:value="${location}" placeholder="City or state"></label></div><div class="form-actions"><button class="button">Filter candidates</button><a class="button secondary" href="/candidate-search">Clear</a></div></form><div class="table-wrap spaced"><table><thead><tr><th>Candidate</th><th>Qualification</th><th>Experience</th><th>Skills</th><th>Location</th><th>Resume</th></tr></thead><tbody><tr th:each="c : ${records}"><td><div class="candidate-cell"><img th:if="${c.photoUrl != null and !#strings.isEmpty(c.photoUrl)}" th:src="${c.photoUrl}" alt="" class="avatar"><div><b th:text="${c.fullName}">Candidate</b><small class="table-sub" th:text="${c.email}">Email</small></div></div></td><td th:text="${c.qualification != null ? c.qualification : c.education}">Qualification</td><td th:text="${c.experienceYears != null ? c.experienceYears : c.experience}">Experience</td><td th:text="${c.skills}">Skills</td><td th:text="${c.location != null ? c.location : c.city}">Location</td><td><a class="text-link" th:href="@{/candidates/{id}/resume(id=${c.id})}">View resume ↗</a></td></tr><tr th:if="${records.isEmpty()}"><td colspan="6" class="empty-cell">No candidates match these filters.</td></tr></tbody></table></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
