<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Recruiter registration | ASMJ Recruitment</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="page narrow"><div class="page-heading"><div><span class="eyebrow">GROW YOUR RECRUITMENT NETWORK</span><h1>Register as a recruiter</h1><p class="muted">Manage hiring workflows and connect qualified candidates with employers.</p></div></div><div th:replace="~{fragments :: flash}"></div><div th:if="${error}" class="error" th:text="${error}"></div><form class="form-card" method="post" th:action="@{/register/recruiter}"><div class="form-grid"><label>Full name<input name="fullName" required maxlength="100" autocomplete="name"></label><label>Work email<input type="email" name="email" required maxlength="160" autocomplete="email"></label><label>Phone number<input name="phone" required maxlength="25" autocomplete="tel"></label><label>Recruitment agency / organization<input name="organization" maxlength="160" placeholder="Company or independent recruiter"></label><label>Years of recruitment experience<input type="number" name="experienceYears" min="0" max="60"></label><label>Primary hiring sectors<input name="sectors" maxlength="250" placeholder="Technology, sales, operations..."></label></div><label>Professional profile / notes<textarea name="profile" rows="3" maxlength="1000"></textarea></label><div class="form-grid"><label>Password<input type="password" name="password" required minlength="8" autocomplete="new-password"></label><label>Confirm password<input type="password" name="confirmPassword" required minlength="8" autocomplete="new-password"></label></div><button class="button">Submit recruiter registration →</button><p class="muted tiny">Recruiter accounts are reviewed by an ASMJ administrator before recruitment-management access is enabled.</p><p class="form-foot">Already registered? <a href="/login">Sign in</a></p></form></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
