<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Publish a job | ASMJ Recruitment</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="page narrow"><div class="page-heading"><div><span class="eyebrow">VACANCY MANAGEMENT</span><h1>Publish a job opening</h1><p class="muted">Create a clear description to attract suitable candidates.</p><p class="muted" th:if="${isRecruiter}">Only employers who have explicitly authorized your recruiter account appear in this list.</p></div></div><div th:replace="~{fragments :: flash}"></div><div th:if="${error}" class="error" th:text="${error}"></div><form class="form-card" method="post" th:action="@{/jobs/save}"><div class="form-grid"><label>Job title<input name="title" required maxlength="150" placeholder="e.g. Java Developer"></label><label>Employer / company<select name="employerId" required><option value="" disabled selected>Select an approved employer</option><option th:each="employer : ${employers}" th:value="${employer.id}" th:text="|${employer.companyName != null ? employer.companyName : (employer.company != null ? employer.company : employer.name)} — ${employer.email}|">Employer name</option></select><small class="muted" th:if="${employers.isEmpty()}">No authorized employers are available yet. Ask an approved employer to grant you job-posting access from their dashboard.</small></label><label>Location<input name="location" required maxlength="100" placeholder="City or remote"></label><label>Job type<select name="jobType"><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Internship</option><option>Remote</option></select></label><label>Annual salary (INR)<input name="salary" maxlength="80" placeholder="e.g. ₹600000 per annum"><small class="muted">Enter one full annual amount in INR (e.g. 600000 or ₹6,00,000 per annum). Do not enter LPA, monthly salary, or a salary range; percentage commission requires a single annual amount.</small></label><label>Experience required<select name="experience"><option value="">Select experience</option><option>Fresher</option><option>0–1 years</option><option>1–3 years</option><option>3–5 years</option><option>5–8 years</option><option>8–12 years</option><option>12+ years</option></select></label><label>Skills / keywords<input name="skills" maxlength="500" placeholder="Java, SQL, communication"></label><label>Application status<select name="status"><option>OPEN</option><option>ON_HOLD</option><option>CLOSED</option></select></label></div><label>Job description<textarea name="description" rows="6" required maxlength="5000" placeholder="Responsibilities, requirements and benefits"></textarea></label><button class="button" th:disabled="${employers.isEmpty()}">Publish opening →</button></form></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
