<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Interviews | ASMJ Recruitment</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="page"><div class="page-heading"><div><span class="eyebrow">INTERVIEW COORDINATION</span><h1>Interviews</h1><p class="muted">Schedule interviews and keep candidate conversations moving.</p></div></div><div th:replace="~{fragments :: flash}"></div><form class="form-card compact-form" method="post" th:action="@{/interviews/save}"><h2>Schedule an interview</h2><div class="form-grid"><label>Candidate name<input name="candidateName" required></label><label>Candidate email<input type="email" name="email"></label><label>Job title<input name="jobTitle" required></label><label>Interviewer<input name="interviewer" required></label><label>Date and time<input type="datetime-local" name="scheduledAt" required></label><label>Interview type<select name="interviewType"><option>Video</option><option>Phone</option><option>In person</option></select></label></div><label>Notes<textarea name="notes" rows="2"></textarea></label><button class="button">Schedule interview →</button></form><div class="table-wrap spaced"><table><thead><tr><th>Candidate</th><th>Role</th><th>Interviewer</th><th>Schedule</th><th>Type</th><th>Status</th></tr></thead><tbody><tr th:each="r : ${records}"><td th:text="${r.candidateName}">Candidate</td><td th:text="${r.jobTitle}">Role</td><td th:text="${r.interviewer}">Interviewer</td><td th:text="${r.scheduledAt}">Date</td><td th:text="${r.interviewType}">Type</td><td><span class="pill" th:text="${r.status}">SCHEDULED</span></td></tr><tr th:if="${records.isEmpty()}"><td colspan="6" class="empty-cell">No interviews scheduled yet.</td></tr></tbody></table></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
