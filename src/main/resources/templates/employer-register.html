<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Employer registration | ASMJ Recruitment</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="page narrow"><div class="page-heading"><div><span class="eyebrow">HIRE WITH CONFIDENCE</span><h1>Register your company</h1><p class="muted">Create an employer account to connect with the right talent.</p></div></div><div th:replace="~{fragments :: flash}"></div><div th:if="${error}" class="error" th:text="${error}"></div><form class="form-card" method="post" th:action="@{/register/employer}"><div class="form-grid"><label>Company name<input name="companyName" required maxlength="160" placeholder="Your company legal or trading name"></label><label>Industry<input name="industry" required maxlength="100" placeholder="e.g. Technology, Finance"></label><label>Contact person<input name="contactPerson" required maxlength="100"></label><label>Business email<input type="email" name="email" required maxlength="160" autocomplete="email"></label><label>Phone number<input name="phone" required maxlength="25" autocomplete="tel"></label><label>Company website<input type="url" name="website" maxlength="200" placeholder="https://"></label><label>City<input name="city" required maxlength="100"></label><label>State<input name="state" required maxlength="100"></label></div><label>Company address<textarea name="address" rows="3" maxlength="500" required></textarea></label><div class="form-grid"><label>Password<input type="password" name="password" required minlength="8" autocomplete="new-password"></label><label>Confirm password<input type="password" name="confirmPassword" required minlength="8" autocomplete="new-password"></label></div><button class="button">Submit employer registration →</button><p class="muted tiny">Employer accounts are reviewed by an ASMJ administrator before job-posting access is enabled.</p><p class="form-foot">Already registered? <a href="/login">Sign in</a></p></form></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
