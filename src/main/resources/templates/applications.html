<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Applications | ASMJ Recruitment</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="page"><div class="page-heading"><div><span class="eyebrow">CANDIDATE PIPELINE</span><h1>Applications</h1><p class="muted">Review applications and move candidates through the recruitment process.</p></div></div><div th:replace="~{fragments :: flash}"></div><div class="table-wrap"><table><thead><tr><th>Reference</th><th>Candidate</th><th>Role</th><th>Applied</th><th>Status / update</th><th>Hiring workflow</th></tr></thead><tbody><tr th:each="r : ${records}"><td th:text="${r.id}">ID</td><td><b th:text="${r.fullName}">Candidate</b><small class="table-sub" th:text="${r.email}">email</small></td><td th:text="${r.jobTitle}">Role</td><td th:text="${r.appliedAt}">Date</td><td><form class="inline-form" method="post" th:action="@{/applications/{id}/status(id=${r.id})}"><select name="status"><option th:each="s : ${ {'APPLIED','SHORTLISTED','INTERVIEW','SELECTED','HIRED','DOCUMENTS_RECEIVED','OFFER_SENT','OFFER_ACCEPTED','JOINED','REJECTED'} }" th:value="${s}" th:text="${s}" th:selected="${s==r.status}"></option></select><button class="mini-button">Save</button></form></td><td><a class="mini-button" th:href="@{/hiring/applications/{id}/documents(id=${r.id})}">Documents & offer</a><small class="table-sub" th:text="|Stage changes: ${r.statusHistory != null ? #lists.size(r.statusHistory) : 0}|">Stage changes: 0</small><small class="table-sub" th:text="${r.offerStatus == null or r.offerStatus == '' ? 'No offer yet' : r.offerStatus}">Offer status</small></td></tr><tr th:if="${records.isEmpty()}"><td colspan="6" class="empty-cell">No applications received yet.</td></tr></tbody></table></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
