<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Placements | ASMJ Recruitment</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="page"><div class="page-heading"><div><span class="eyebrow">SUCCESS STORIES</span><h1>Placements</h1><p class="muted">Record successful hires and track consultancy fees.</p></div></div><div th:replace="~{fragments :: flash}"></div><form class="form-card compact-form" method="post" action="/placements/save"><h2>Record a placement</h2><div class="form-grid"><label>Candidate name<input name="candidateName" required></label><label>Candidate email<input type="email" name="email"></label><label>Employer / company<input name="company" required></label><label>Job title<input name="jobTitle" required></label><label>Joining date<input type="date" name="joiningDate"></label><label>Annual salary (₹)<input type="number" min="0" step="0.01" name="salary"></label><label>Consultancy fee (₹)<input type="number" min="0" step="0.01" name="fee"></label><label>Fee status<select name="feeStatus"><option>Pending</option><option>Invoiced</option><option>Paid</option></select></label></div><button class="button">Save placement →</button></form><div class="table-wrap spaced"><table><thead><tr><th>Candidate</th><th>Company</th><th>Role</th><th>Joining date</th><th>Salary</th><th>Fee</th><th>Fee status</th></tr></thead><tbody><tr th:each="r : ${records}"><td th:text="${r.candidateName}">Candidate</td><td th:text="${r.company}">Company</td><td th:text="${r.jobTitle}">Role</td><td th:text="${r.joiningDate}">Date</td><td th:text="${r.salary}">Salary</td><td th:text="${r.fee}">Fee</td><td th:text="${r.feeStatus}">Pending</td></tr><tr th:if="${records.isEmpty()}"><td colspan="7" class="empty-cell">No placements recorded yet.</td></tr></tbody></table></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
