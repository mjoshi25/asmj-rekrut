<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Candidate registration | ASMJ Recruitment</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="page narrow"><div class="page-heading"><div><span class="eyebrow">YOUR NEXT CHAPTER</span><h1>Create your candidate profile</h1><p class="muted">Tell us a little about yourself so we can help you find a fit.</p></div></div><div th:replace="~{fragments :: flash}"></div><div th:if="${error}" class="error" th:text="${error}"></div><form class="form-card" method="post" th:action="@{/register/candidate}"><div class="form-grid"><label>Full name<input name="fullName" required maxlength="100" placeholder="Your full name"></label><label>Email address<input name="email" type="email" required maxlength="160" placeholder="you@example.com"></label><label>Phone number<input name="phone" required maxlength="25" placeholder="+91 ..."></label><label>Password<input name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></label><label>Confirm password<input name="confirmPassword" type="password" required minlength="8" autocomplete="new-password" placeholder="Repeat password"></label><label>Current location<input name="location" required maxlength="100" placeholder="City, State"></label><label>Highest qualification<input name="education" maxlength="120" placeholder="Degree or qualification"></label><label>Years of experience<input name="experience" type="number" min="0" max="60" placeholder="0"></label><label>Key skills<input name="skills" maxlength="500" placeholder="Java, sales, finance..."></label><label>Expected salary (annual)<input name="expectedSalary" maxlength="60" placeholder="e.g. ₹6–8 LPA"></label></div><label>Professional summary<textarea name="summary" rows="4" maxlength="1500" placeholder="Experience, strengths and the role you're seeking"></textarea></label><button class="button">Create profile <span>→</span></button><p class="muted tiny">Create your login securely. Use at least 8 characters for your password.</p></form></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
