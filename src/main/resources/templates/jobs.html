<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Find jobs | ASMJ Recruitment</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="page"><div class="page-heading"><div><span class="eyebrow">CAREER OPPORTUNITIES</span><h1>Find your next role</h1><p class="muted">Explore openings and take the next step.</p></div><a class="button secondary" href="/jobs/new">＋ Add job</a></div><form class="searchbar listing-search" action="/jobs"><input name="q" th:value="${q}" placeholder="Search title or location"><button>Search →</button></form><div class="job-grid" th:if="${!jobs.isEmpty()}"><article class="job-card" th:each="job : ${jobs}"><div class="job-icon">↗</div><span class="pill" th:text="${job.status} ?: 'OPEN'">OPEN</span><h3 th:text="${job.title}">Role title</h3><p th:text="${job.company} ?: 'ASMJ partner employer'">Company</p><div class="job-meta"><span>⌖ <span th:text="${job.location} ?: 'Flexible'">Location</span></span><span th:text="${job.jobType} ?: 'Full-time'">Full-time</span></div><a th:href="@{/opportunity/{id}(id=${job.id})}" class="card-link">View opportunity <span>→</span></a></article></div><div class="empty-state" th:if="${jobs.isEmpty()}"><h3>No matching jobs yet</h3><p>Try a different keyword or check back soon.</p></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
