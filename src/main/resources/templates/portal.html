<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My portal | ASMJ Recruitment</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="page"><div class="page-heading"><div><span class="eyebrow">YOUR ASMJ SPACE</span><h1>My portal</h1><p class="muted" th:text="${username}">user</p></div><div class="form-actions"><a class="button" href="/candidate/profile">Edit profile / Resume →</a><a class="button secondary" href="/candidate/hiring">Hiring & offers →</a><a class="button secondary" href="/jobs">Explore jobs →</a></div></div><section class="panel"><h2>My applications</h2><div class="table-wrap"><table><thead><tr><th>Reference</th><th>Role</th><th>Applied</th><th>Status</th></tr></thead><tbody><tr th:each="r : ${applications}"><td th:text="${r.id}">ID</td><td th:text="${r.jobTitle}">Role</td><td th:text="${r.appliedAt}">Date</td><td th:text="${r.status}">Status</td></tr><tr th:if="${applications.isEmpty()}"><td colspan="4" class="empty-cell">No applications linked to this signed-in email yet.</td></tr></tbody></table></div></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
