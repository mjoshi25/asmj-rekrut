<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${type}+' | ASMJ Recruitment'">Records</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="page"><div class="page-heading"><div><span class="eyebrow">RECRUITMENT WORKSPACE</span><h1 th:text="${type}">Records</h1><p class="muted">Review records currently available in this environment.</p></div><a class="button" th:if="${type=='Employers'}" href="/employers/new">＋ Add employer</a><a class="button" th:if="${type=='Candidates'}" href="/register/candidate">＋ Register candidate</a></div><div th:replace="~{fragments :: flash}"></div><div class="table-wrap"><table><thead><tr><th>Reference</th><th>Name / Company</th><th>Email</th><th>Location</th><th>Status</th></tr></thead><tbody><tr th:each="r : ${records}"><td th:text="${r.id}">ID</td><td th:text="${r.fullName} ?: (${r.companyName} ?: (${r.company} ?: '—'))">Name</td><td th:text="${r.email} ?: '—'">Email</td><td th:text="${r.location} ?: '—'">Location</td><td><span class="pill" th:text="${r.status} ?: 'ACTIVE'">ACTIVE</span></td></tr><tr th:if="${records.isEmpty()}"><td colspan="5" class="empty-cell">No records yet. Add your first record to get started.</td></tr></tbody></table></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
