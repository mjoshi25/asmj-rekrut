spring.application.name=asmj-recruitment
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8080}
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# New offer letters and joining documents are stored in Cloudinary as authenticated raw assets.
# ASMJ_UPLOAD_DIR is retained only to allow authorized downloads of older files stored locally.
asmj.upload-dir=${ASMJ_UPLOAD_DIR:./data/private-uploads}

# Optional email delivery for interview invitations (disabled unless explicitly enabled)
asmj.mail.enabled=${ASMJ_MAIL_ENABLED:false}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

# Keep offer-upload request diagnostics visible in Render logs.
logging.level.in.asmj.recruitment=INFO
